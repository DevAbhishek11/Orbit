global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'orbit-api'
    static_configs:
      - targets: ['api:8010', 'host.docker.internal:8010']
    metrics_path: '/metrics'
    bearer_token: 'internal-scrape-token'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

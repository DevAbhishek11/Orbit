# Local development infrastructure; run the API/web using npm run dev.
services:
  mongo:
    image: mongo:7
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}) }'"]
      interval: 5s
      timeout: 10s
      retries: 20
  redis-cache:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    ports: ["127.0.0.1:6379:6379"]
  redis-queue:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:6380:6379"]
    volumes: [queue-data:/data]
volumes:
  mongo-data:
  queue-data:

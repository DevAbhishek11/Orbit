# ════════════════════════════════════════════════════════════════════
#  ORBIT — redis-queue configuration (port 6380)
#  Purpose: BullMQ queues ONLY. Job data is NOT derivable —
#  eviction is forbidden and AOF durability is mandatory.
#  Cache/pubsub must NEVER use this instance (see redis-cache.conf).
# ════════════════════════════════════════════════════════════════════

port 6380
bind 127.0.0.1
requirepass queue_pw

# Eviction: NEVER evict queue data — writes fail with OOM instead (alertable)
maxmemory 256mb
maxmemory-policy noeviction

# Durability: AOF with everysec fsync — survives restarts, ≤1s loss window
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
aof-use-rdb-preamble yes

# Light RDB as a secondary safety net
save 900 1

# Client hygiene
timeout 0
tcp-keepalive 60
maxclients 10000

# Observability
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

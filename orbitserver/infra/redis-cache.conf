# ════════════════════════════════════════════════════════════════════
#  ORBIT — redis-cache configuration (port 6379)
#  Purpose: cache / pubsub / presence / rate-limit / idempotency.
#  Data here is DERIVABLE — eviction is allowed, durability is not needed.
#  BullMQ must NEVER use this instance (see redis-queue.conf).
# ════════════════════════════════════════════════════════════════════

port 6379
bind 127.0.0.1
requirepass cache_pw

# Eviction: cache is allowed to drop keys under memory pressure
maxmemory 256mb
maxmemory-policy allkeys-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Persistence: light snapshot only (cache is rebuildable), no AOF
save 900 1
appendonly no

# Keyspace notifications for TTL expiry (presence / typing cleanup)
notify-keyspace-events "Ex"

# Client hygiene
timeout 300
tcp-keepalive 60
maxclients 10000

# Observability
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

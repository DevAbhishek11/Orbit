name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f orbitserver/Dockerfile -t orbit-api:test .
      - run: docker build -f orbitserver/Dockerfile.worker -t orbit-worker:test .
      - run: docker build -f orbit/Dockerfile -t orbit-web:test .

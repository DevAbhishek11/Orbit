name: Security
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high
      - run: npx eslint . --max-warnings=0

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          ! git log --all -p | grep -i -E "BEGIN (RSA )?PRIVATE KEY|mongodb\+srv://.*@|JWT_SECRET=.+[^*]{10}" | grep -v "example" | head -n 20
